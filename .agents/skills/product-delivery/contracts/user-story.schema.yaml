$schema: "https://json-schema.org/draft/2020-12/schema"
title: HybridUserStory
type: object
required:
  - title
  - business_value
  - actor
  - action
  - benefit
  - description
  - acceptance_criteria
properties:
  id:
    type: string
  source_pitch_id:
    type: string
  epic_id:
    type: string
  source_scope_id:
    type: string
  title:
    type: string
  business_value:
    type: string
  actor:
    type: string
  action:
    type: string
  benefit:
    type: string
  description:
    type: string
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, given, when, then]
      properties:
        id: {type: string}
        given: {type: string}
        when: {type: string}
        then: {type: string}
  out_of_scope:
    type: array
    items: {type: string}
  pending_definitions:
    type: array
    items: {type: string}
  classification:
    enum: [must_have, nice_to_have, proposed]
  dependencies:
    type: array
    items: {type: string}
  relations:
    type: array
    items:
      type: object
      required: [from, to, type]
      properties:
        from: {type: string}
        to: {type: string}
        type: {type: string}
        reason: {type: string}
  task_ids:
    type: array
    items: {type: string}
  status:
    type: string
  af_details:
    type: object
    additionalProperties: true
