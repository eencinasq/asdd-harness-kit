$schema: "https://json-schema.org/draft/2020-12/schema"
title: ProductDiscovery
type: object
required:
  - problem_statement
  - desired_outcome
  - business_value
  - in_scope
properties:
  problem_statement:
    type: string
    minLength: 1
  target_users:
    type: array
    items:
      type: string
  current_state:
    type: string
  desired_outcome:
    type: string
    minLength: 1
  business_value:
    type: string
    minLength: 1
  in_scope:
    type: array
    items:
      type: string
  out_of_scope:
    type: array
    items:
      type: string
  constraints:
    type: array
    items:
      type: string
  dependencies:
    type: array
    items:
      type: string
  assumptions:
    type: array
    items:
      type: string
  risks:
    type: array
    items:
      type: string
  open_questions:
    type: array
    items:
      type: string
  success_criteria:
    type: array
    items:
      type: string
