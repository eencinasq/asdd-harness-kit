$schema: "https://json-schema.org/draft/2020-12/schema"
title: HybridUserStory
type: object
required:
  - title
  - business_value
  - actor
  - action
  - benefit
  - description
  - acceptance_criteria
properties:
  title:
    type: string
  business_value:
    type: string
  actor:
    type: string
  action:
    type: string
  benefit:
    type: string
  description:
    type: string
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, given, when, then]
      properties:
        id: {type: string}
        given: {type: string}
        when: {type: string}
        then: {type: string}
  out_of_scope:
    type: array
    items: {type: string}
  pending_definitions:
    type: array
    items: {type: string}
  af_details:
    type: object
    additionalProperties: true
