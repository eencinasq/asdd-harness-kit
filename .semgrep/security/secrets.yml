rules:
  - id: sec.secret-not-logged
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A secret from the environment (an API key, token, secret or password) is written to a log, stdout/stderr or a
      telemetry span. Logs and spans are kept on disk and pasted into issues; log only whether the secret is set.
    metadata:
      category: security
      adr: security-rules.md
    paths:
      include: ["/cli/**", "/tools/*/src/**"]
      exclude: ["*.test.mjs", "*.spec.ts", "/cli/dist/**"]
    patterns:
      - pattern-either:
          - pattern: console.$LOG(..., <... process.env.$NAME ...>, ...)
          - pattern: $LOGGER.$LEVEL(..., <... process.env.$NAME ...>, ...)
          - pattern: process.stdout.write(<... process.env.$NAME ...>)
          - pattern: process.stderr.write(<... process.env.$NAME ...>)
          - pattern: "{..., attributes: {..., $K: <... process.env.$NAME ...>, ...}, ...}"
      # Reporting only whether a secret is set is fine: `${process.env.X ? 'set' : 'missing'}`, !!X, Boolean(X).
      - pattern-not: '$F(..., <... process.env.$NAME ? $A : $B ...>, ...)'
      - pattern-not: '$O.$F(..., <... process.env.$NAME ? $A : $B ...>, ...)'
      - pattern-not: $F(..., <... !!process.env.$NAME ...>, ...)
      - pattern-not: $O.$F(..., <... Boolean(process.env.$NAME) ...>, ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: ^\w*(KEY|TOKEN|SECRET|PASSWORD)\w*$
