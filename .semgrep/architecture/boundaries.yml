rules:
  - id: arch.harness-no-agents-import
    languages: [javascript]
    severity: ERROR
    message: >-
      cli/src/harness must not import from .agents/ — .agents/ holds installed COPIES of cli/ sources
      (domain-layer.project.md "Semgrep boundaries"). Import the source under cli/ instead.
    metadata:
      category: architecture
      adr: domain-layer.project.md#semgrep-boundaries
    paths:
      include: ["/cli/src/harness/**"]
      exclude: ["*.test.mjs"]
    patterns:
      - pattern-either:
          - pattern: import "$MOD"
          - pattern: import $X from "$MOD"
          - pattern: import { $...X } from "$MOD"
          - pattern: import * as $X from "$MOD"
          - pattern: import("$MOD")
          - pattern: require("$MOD")
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(.*/)?\.agents/

  - id: arch.cli-no-tools-import
    languages: [javascript]
    severity: ERROR
    message: >-
      The CLI must not import the kit's MCP servers under tools/: they stay in the kit and never ship
      to projects (structure.md). Share logic through cli/src/harness (vendored into tools/ by asdd kit vendor).
    metadata:
      category: architecture
      adr: structure.md#root-layout
    paths:
      include: ["/cli/**"]
      exclude: ["*.test.mjs"]
    patterns:
      - pattern-either:
          - pattern: import "$MOD"
          - pattern: import $X from "$MOD"
          - pattern: import { $...X } from "$MOD"
          - pattern: import * as $X from "$MOD"
          - pattern: import("$MOD")
          - pattern: require("$MOD")
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(.*/)?tools/
